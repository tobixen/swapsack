repos:
  # === PRE-COMMIT STAGE (quick checks on every commit) ===
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  # === COMMIT-MSG: enforce Conventional Commits ===
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # === PRE-PUSH STAGE (full test suite + link check before pushing) ===
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # Link check (excludes/accept-codes live in lychee.toml, auto-discovered).
  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.24.2
    hooks:
      - id: lychee
        # LYCHEE_VERSION must be repeated here, and must match `rev` above.
        # Without it the hook script works its own version out with `git
        # describe` inside pre-commit's cached clone — but git exports GIT_DIR
        # into every hook process, so under `git push` that describe runs
        # against *this* repo instead, finds no `lychee-*` tag, and exits 100
        # with "rev must be a versioned release tag". The rev is fine; the probe
        # is looking at the wrong repository. Passing the version as the first
        # argument is the script's own escape hatch and skips the probe.
        args: ["LYCHEE_VERSION=0.24.2",
               "--no-progress", "--cache", "--max-cache-age", "1d", "."]
        pass_filenames: false
        stages: [pre-push]
